# Overrides only these keys from src/main/resources/application.properties during tests.
# In-memory H2 in PostgreSQL mode, so tests don't need a running Postgres.
# Flyway still runs the real migrations against it.
spring.datasource.url=jdbc:h2:mem:mediatracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Tests need an empty database, so don't import data/*.json at startup.
mediatracker.import.enabled=false
