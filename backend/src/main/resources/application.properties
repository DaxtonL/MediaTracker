spring.application.name=mediatracker

# PostgreSQL connection. Override with env vars, e.g. DB_URL=jdbc:postgresql://host:5432/mediatracker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediatracker}
spring.datasource.username=${DB_USERNAME:mediatracker}
spring.datasource.password=${DB_PASSWORD:mediatracker}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks that it matches the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
server.error.include-message=always

# Import the old Swing app's tracker files at startup.
# The path is relative to where you start the app (backend/ when using ./mvnw).
# Files starting with the skip prefix (the old test fixtures) are ignored.
# Trackers that already exist in the database are skipped, so this is safe to leave on.
mediatracker.import.enabled=true
mediatracker.import.dir=../data
mediatracker.import.skip-prefix=test
