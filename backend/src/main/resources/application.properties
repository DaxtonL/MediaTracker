spring.application.name=mediatracker
spring.datasource.url=jdbc:h2:mem:mediatracker
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
server.error.include-message=always

# Import the old Swing app's tracker files at startup.
# The path is relative to where you start the app (backend/ when using ./mvnw).
# Files starting with the skip prefix (the old test fixtures) are ignored.
mediatracker.import.enabled=true
mediatracker.import.dir=../data
mediatracker.import.skip-prefix=test
